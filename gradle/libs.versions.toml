[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
coroutines = "1.11.0"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
junit = "6.1.3"
hilt = "2.60.1"
ksp = "2.3.12"
espresso = "3.7.0"
benchmark = "1.5.0"
uiautomator = "2.4.0"
recyclerview = "1.4.0"
profileinstaller = "1.4.1"

[libraries]
androidxTestRules = { module = "androidx.test:rules", version.ref = "androidxTest" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
androidxBrowser = { module = "androidx.browser:browser", version = "1.10.0" }
workRuntime = { module = "androidx.work:work-runtime", version = "2.12.0" }
workTesting = { module = "androidx.work:work-testing", version = "2.12.0" }
serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
coroutinesTest = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
coroutinesCore = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinGradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
androidxActivityCompose = { module = "androidx.activity:activity-compose", version.ref = "androidxActivity" }
androidxLifecycleViewModel = { module = "androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidxLifecycle" }
androidxLifecycleRuntimeCompose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidxLifecycle" }
coroutinesAndroid = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
composeBom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
composeRuntime = { module = "androidx.compose.runtime:runtime" }
composeUi = { module = "androidx.compose.ui:ui" }
composeFoundation = { module = "androidx.compose.foundation:foundation" }
composeMaterial3 = { module = "androidx.compose.material3:material3" }
composeTestManifest = { module = "androidx.compose.ui:ui-test-manifest" }
composeTestJunit4 = { module = "androidx.compose.ui:ui-test-junit4" }
androidxTestJunit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidxTestRunner = { module = "androidx.test:runner", version.ref = "androidxTest" }
junitJupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junitPlatformLauncher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit" }

hiltAndroid = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hiltCompiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }

espressoCore = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

benchmarkMacro = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "recyclerview" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }

[plugins]
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
androidTest = { id = "com.android.test", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlinCompose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

baselineProfile = { id = "androidx.baselineprofile", version.ref = "benchmark" }
